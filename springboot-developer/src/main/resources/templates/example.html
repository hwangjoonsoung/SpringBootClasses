<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
  <h1>타임 리프 익히기</h1>
<p th:text="${#temporals.format(today,'yyyy-MM-dd')}"></p>
<div th:object="${person}">
  <p th:text="|이름 : *{name}|"></p>
  <p th:text="|나이 : *{age}|"></p>
  <p>취미</p>
  <ul th:each="hobby : *{hobbies}">
    <span th:if="${hobby =='운동'}">(대표취미)</span>
  </ul>
</div>
<a th:href="@{/api/articles/{id}(id=${person.id})}"></a>
</body>
</html>
